<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RavenDB Architecture Map</title>
    <script>
      // Applied before first paint so a returning light-mode user doesn't see
      // a flash of the (default) dark theme. Dark needs no attribute - it's
      // the :root default in App.css.
      try {
        if (localStorage.getItem('ravendb-map-theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
        }
      } catch (e) {
        // Storage blocked (private mode, embedded in an iframe) - keep the default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
